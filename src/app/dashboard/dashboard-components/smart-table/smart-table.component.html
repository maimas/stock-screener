<!-- "cut-left" and "cut-right" say that columns are out of sight on that side: the pinned column there then casts a
     shadow, and has none while everything on its side is in view. -->
<div class="table-scroll" [class.cut-left]="cutLeft" [class.cut-right]="cutRight">
<table mat-table [attr.aria-label]="label || null" [dataSource]="dataSource" [trackBy]="trackByKey" multiTemplateDataRows matSort [matSortActive]="defaultSortColumn"
       [matSortDirection]="defaultSortDirection" matSortDisableClear (matSortChange)="onSort($event)" class="smart-table" [class.short]="!!visibleColumns">
  <ng-container *ngFor="let itemDef of tableDefinition; trackBy: trackByIndex"
                [matColumnDef]="itemDef.columnName" [sticky]="isSticky(itemDef)">
    <!-- What a column means is shown under the pointer and also when its heading is reached with the Tab key:
         the heading cell holds the explanation, and focus anywhere inside the cell shows it. -->
    <!-- The rows can follow several columns: a click with the Shift key held adds a column as the next key. Its
         heading then shows an arrow of its own (Material draws one for the first key only), and once there are two
         keys each shows its place as a small number. -->
    <th mat-header-cell scope="col" *matHeaderCellDef mat-sort-header [disabled]="!itemDef.sortValue"
        [start]="itemDef.sortStart ?? 'desc'" [class.starts-up]="itemDef.sortStart === 'asc'"
        [attr.data-column]="itemDef.columnName"
        [class.also-up]="alsoWay(itemDef.columnName) === 'asc'" [class.also-down]="alsoWay(itemDef.columnName) === 'desc'"
        [matTooltip]="tipOf(itemDef)" matTooltipClass="multiline-tooltip" #help="matTooltip"
        (focusin)="help.show()" (focusout)="help.hide()">
      <span [class.has-help]="!!itemDef.columnTooltip">{{ itemDef.columnDisplayName }}</span><span class="sort-place" *ngIf="placeOf(itemDef.columnName) as place" aria-hidden="true">{{ place }}</span><span class="visually-hidden" *ngIf="alsoWords(itemDef.columnName) as words">{{ words }}</span>
    </th>
    <td mat-cell *matCellDef="let element">
      <ng-container *ngTemplateOutlet="itemDef.template; context: {templateData: itemDef.templateData(element)}">
      </ng-container>
    </td>
  </ng-container>

  <!-- Open/close button, pinned on the right so it stays visible while the table scrolls sideways. -->
  <ng-container matColumnDef="__toggle" stickyEnd>
    <th mat-header-cell *matHeaderCellDef class="toggle-cell"><span class="visually-hidden">Details</span></th>
    <td mat-cell *matCellDef="let element" class="toggle-cell">
      <button mat-icon-button type="button" class="toggle"
              [attr.aria-expanded]="isExpanded(element)"
              [attr.aria-label]="(isExpanded(element) ? 'Hide details for ' : 'Show details for ') + rowLabel(element)"
              [matTooltip]="rowTip(element)" matTooltipPosition="left"
              (click)="toggle(element)" (keydown.escape)="isExpanded(element) && toggle(element)">
        <mat-icon>{{ isExpanded(element) ? 'expand_less' : 'expand_more' }}</mat-icon>
      </button>
    </td>
  </ng-container>

  <ng-container matColumnDef="__detail">
    <td mat-cell *matCellDef="let element" class="detail-cell" [attr.colspan]="rowColumns.length">
      <div class="detail" *ngIf="detailTemplate && isExpanded(element)">
        <ng-container *ngTemplateOutlet="detailTemplate; context: {row: element}"></ng-container>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="rowColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: rowColumns;" class="main-row"
      [class.clickable]="!!detailTemplate" [class.expanded]="isExpanded(row)" (click)="onRowClick(row, $event)"></tr>
  <tr mat-row *matRowDef="let row; columns: detailColumns" class="detail-row" [class.open]="isExpanded(row)" [attr.data-detail]="rowKey(row)"></tr>
</table>
</div>
