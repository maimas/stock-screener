<div class="container" [matTooltip]="tooltip" matTooltipClass="multiline-tooltip">
  <ng-container *ngIf="signal; else noSignal">
    <span [class]="'verdict-pill ' + verdictClass">{{ signal.verdict }}</span>
    <span class="below" *ngIf="dipText">{{ dipText }}</span>
    <mat-icon *ngIf="signal.earningsSoon" class="earnings-flag" aria-hidden="false" aria-label="Reports its results within 2 weeks">flag</mat-icon>
  </ng-container>
  <ng-template #noSignal>
    <span class="verdict-pill none">{{ noMark }}</span>
    <span class="below">{{ noVerdictLabel }}</span>
  </ng-template>
</div>
