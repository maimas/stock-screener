<!-- With sizes to show, the heading says what they are a share of; the sentence about them opens with the other
     sentences of the details (their one control, at the head of the details). -->
<h4>{{ title }}<span class="unit" *ngIf="marked && lines.length > 0"> · its size, as a share of each portfolio</span></h4>
<ng-container *ngIf="marked; else unmarked">
  <ng-container *ngIf="lines.length > 0; else worthNothing">
    <ul>
      <li *ngFor="let line of lines">{{ line }}</li>
    </ul>
    <p class="hint" appMoreRest="details.words">{{ note }}</p>
  </ng-container>
  <ng-template #worthNothing>
    <p class="hint">{{ noPortfolio }}</p>
  </ng-template>
</ng-container>
<ng-template #unmarked>
  <!-- A few words for the fact; why it is so opens with the other sentences of the details. -->
  <p class="hint short">{{ noSize }}</p>
  <p class="hint" appMoreRest="details.words">{{ notMarked }}</p>
</ng-template>
