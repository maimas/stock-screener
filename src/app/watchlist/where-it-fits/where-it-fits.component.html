<!-- With sizes to show, what a size is stands behind "more" at the heading: the lines say it by themselves to who
     has read it once. Without sizes the sentence is all there is, and it is shown. -->
<h4>{{ title }}<span class="unit" *ngIf="marked && lines.length > 0"> · its size, as a share of each portfolio</span><app-more *ngIf="!marked || lines.length > 0" key="details.fits" what="what these sizes are"></app-more></h4>
<ng-container *ngIf="marked; else unmarked">
  <ng-container *ngIf="lines.length > 0; else worthNothing">
    <ul>
      <li *ngFor="let line of lines">{{ line }}</li>
    </ul>
    <p class="hint" appMoreRest="details.fits">{{ note }}</p>
  </ng-container>
  <ng-template #worthNothing>
    <p class="hint">{{ noPortfolio }}</p>
  </ng-template>
</ng-container>
<ng-template #unmarked>
  <!-- A few words for the fact; why it is so is behind "more" at the heading. -->
  <p class="hint short">{{ noSize }}</p>
  <p class="hint" appMoreRest="details.fits">{{ notMarked }}</p>
</ng-template>
